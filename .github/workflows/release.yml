name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # the tag is the single thing that triggers a release, so it must agree
      # with the version that is about to be uploaded
      - name: Check the tag against the version in pyproject.toml
        run: |
          tagversion="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tagversion" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml."
            exit 1
          fi

      - name: Install phasedist and its test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install ".[test]"

      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        run: |
          for testfile in tests/test_*.py; do
            echo "::group::$testfile"
            python "$testfile"
            echo "::endgroup::"
          done

      - name: Build the source distribution and the wheel
        run: python -m build

      - name: Check the built distribution
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phasedist

    # the token the trusted publisher exchanges for an upload permit
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

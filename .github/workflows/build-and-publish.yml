name: Build, test and publish

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a superseded pull request run is wasted work, but a release must never be
  # cancelled half way through
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # the tag is the only thing that triggers a release, so it has to agree
      # with the version that is about to be uploaded. Checked before anything
      # is built, so a mistyped tag costs seconds rather than a full test run
      - name: Check the tag against the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagversion="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tagversion" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml."
            exit 1
          fi
          echo "Releasing version ${version}."

      # phasedist is pure Python, so one sdist and one py3-none-any wheel serve
      # every operating system. They are built once here and the test jobs
      # install this exact wheel, which is what makes the matrix a test of the
      # artefact rather than of the working tree
      - name: Build the source distribution and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the built distribution
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # every operating system against every Python version the classifiers
        # in pyproject.toml claim: fifteen jobs, which run in parallel, so the
        # wall-clock cost is one job rather than fifteen
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # only for the tests themselves; the package under test is the wheel
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist

      - name: Install the built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(ls dist/*.whl)[test]"

      # Each test file puts ../src on sys.path so it can be run from a clone
      # without installing anything. Run from the checkout and that shadows the
      # wheel, and the matrix would be testing the working tree on three
      # operating systems instead of the thing being released. Copying the
      # tests elsewhere leaves that path pointing at nothing, Python ignores it,
      # and the installed package is what gets imported
      - name: Run the test suite against the installed package
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          cp -r tests "${RUNNER_TEMP}/phasedist-tests"
          cd "${RUNNER_TEMP}/phasedist-tests"
          for testfile in test_*.py; do
            echo "::group::$testfile"
            python "$testfile"
            echo "::endgroup::"
          done

  minimumdependencies:
    name: oldest supported dependencies
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist

      # the floors declared in pyproject.toml, pinned exactly, so a release
      # cannot claim support for versions it was never run against. --no-deps
      # stops pip quietly upgrading them to satisfy the wheel
      - name: Install the floors, then the wheel on top
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.0" "scipy==1.10.0" "matplotlib==3.7.0" "statsmodels==0.14.0"
          python -m pip install --no-deps "$(ls dist/*.whl)"

      - name: Run the test suite against the installed package
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          cp -r tests "${RUNNER_TEMP}/phasedist-tests"
          cd "${RUNNER_TEMP}/phasedist-tests"
          for testfile in test_*.py; do
            echo "::group::$testfile"
            python "$testfile"
            echo "::endgroup::"
          done

  publish:
    name: publish to PyPI
    needs: [build, test, minimumdependencies]
    runs-on: ubuntu-latest
    # never on a pull request or a manual run, only on a pushed tag
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/phasedist
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

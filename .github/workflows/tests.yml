name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install phasedist and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run the test suite
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          for testfile in tests/test_*.py; do
            echo "::group::$testfile"
            python "$testfile"
            echo "::endgroup::"
          done

  minimumdependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # the lower bounds declared in pyproject.toml, pinned exactly, so a
      # release cannot claim support for a version it was never run against
      - name: Install the oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.0" "scipy==1.10.0" "matplotlib==3.7.0" "statsmodels==0.14.0"
          python -m pip install --no-deps .

      - name: Run the test suite
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          for testfile in tests/test_*.py; do
            echo "::group::$testfile"
            python "$testfile"
            echo "::endgroup::"
          done
